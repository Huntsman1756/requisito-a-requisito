name: e2e-browsers (manual)

# B2.2 — este PC no arranca Firefox/WebKit; la matriz se ejecuta en CI contra
# el export estático (out/) generado en el propio job.
#
# `mode: strict` construye la ruta de release (build:release + release:verify
# fail-closed). Sin aprobaciones humanas aplicadas, el modo strict DEBE fallar
# — ese rojo es el comportamiento esperado y está documentado (regla 4.12).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | strict (release del jurado)"
        required: true
        default: normal
        type: choice
        options: [normal, strict]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - name: Build normal
        if: inputs.mode != 'strict'
        run: npm run build
      - name: Build release estricto + verify (fail-closed)
        if: inputs.mode == 'strict'
        run: npm run build:release && npm run release:verify
      # El export estático se sirve con scripts/serve-export.mjs (lo arranca
      # el propio Playwright como webServer).
      - name: "e2e funcional — escritorio + móvil (Firefox/WebKit)"
        run: npx playwright test --project=desktop-firefox --project=desktop-webkit --project=mobile-ios15 --project=mobile-iphonese --project=mobile-firefox --project=tablet-ios
        env:
          CI: "true"
      - name: "Suite visual-layout (WebKit)"
        run: npx playwright test tests/e2e/visual-layout.spec.ts --project=desktop-webkit
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-firefox-webkit
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
