name: e2e-browsers (manual)

# B2.2 — este PC no arranca Firefox/WebKit; la matriz se ejecuta en CI contra
# el export estático (out/) generado en el propio job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      # El export estático se sirve con scripts/serve-export.mjs (lo arranca
      # el propio Playwright como webServer).
      - run: npx playwright test --project=desktop-firefox --project=desktop-webkit
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-firefox-webkit
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
