name: Freshness diario (F9)

on:
  schedule:
    - cron: "0 5 * * *" # 06:00 Europe/Madrid (CET)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Revalidar fuentes y descubrir leads
        id: fresh
        run: |
          set -o pipefail
          npx tsx scripts/freshness.ts | tee freshness-log.txt

      - name: Aviso por fuente stale
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              stale = json.load(open("data/eligibility/freshness-stale.json")).get("stale", [])
          except Exception:
              stale = []
          for sid in stale:
              title = f"Revisar fuente: {sid} ha cambiado y sus extractos ya no están presentes"
              body = (
                  f"La revalidación diaria detectó que `{sid}` cambió y al menos "
                  "un extracto citado ya no aparece en el texto nuevo. Las reglas "
                  "que la citan salen del bundle (fail-closed) hasta revisión manual.\n\n"
                  "_Generado por el job de frescura._"
              )
              subprocess.run(
                  ["gh", "issue", "create", "--title", title, "--body", body, "--label", "freshness"],
                  env={**os.environ, "GH_TOKEN": os.environ.get("GITHUB_TOKEN", "")},
                  check=False,
              )
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate completo antes de publicar
        id: gate
        run: npm run validate:full

      - name: Commit freshness
        if: steps.gate.outcome == 'success'
        env:
          GIT_EDITOR: "true" # rebase --continue sin editor interactivo
        run: |
          git config user.name "requisito-bot"
          git config user.email "requisito-bot@users.noreply.github.com"
          for p in data/eligibility/sources data/eligibility/freshness-stale.json data/freshness data/catalog/leads-new.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "sin cambios que commitear"
            exit 0
          fi
          git commit -m "chore(freshness): revalidación diaria de fuentes"
          # Carrera: otro commit puede haber entrado mientras corría el job
          # (ocurrió el 08/10). Integrar y reintentar hasta 3 veces; nunca force.
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Único conflicto admisible: runs.jsonl (append en ambos lados) —
              # se resuelve concatenando; cualquier otro aborta limpio en rojo.
              if git status --porcelain | grep -q "^UU data/freshness/runs.jsonl$" \
                && ! git status --porcelain | grep "^UU" | grep -vq "runs.jsonl"; then
                # Concatenar ambos lados (cada uno es append-only) — sin marcadores.
                git show ":2:data/freshness/runs.jsonl" > /tmp/runs-ours.jsonl
                git show ":3:data/freshness/runs.jsonl" > /tmp/runs-theirs.jsonl
                cat /tmp/runs-ours.jsonl /tmp/runs-theirs.jsonl | sort -u > data/freshness/runs.jsonl
                git add data/freshness/runs.jsonl
                git rebase --continue
              else
                echo "::error::rebase con conflicto no resoluble — job en rojo a propósito"
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push; then
              echo "push OK en intento $i"
              exit 0
            fi
            echo "push rechazado (intento $i) — reintento tras espera"
            sleep $((i * 20))
          done
          echo "::error::push rechazado tras 3 intentos — la revalidación de hoy queda pendiente"
          exit 1
