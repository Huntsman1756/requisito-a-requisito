name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Modo de publicación (variable del repo vars.RELEASE_MODE):
      #   normal → build normal con todas las reglas (por defecto, HOY).
      #   strict → release del jurado: solo reglas humanReview=approved y
      #            release:verify sobre el export (fail-closed).
      # NO activar strict antes del 14/10 (F10-REL-2, ADR-050): lo cambia
      # Daniel o la sesión del 14 con su OK, tras aplicar las hojas.
      - name: Validate normal (RELEASE_MODE ausente o 'normal')
        if: vars.RELEASE_MODE != 'strict'
        run: npm run validate:full
        env:
          BASE_PATH: /requisito-a-requisito
      - name: Install Chromium for release completeness
        if: vars.RELEASE_MODE == 'strict'
        run: npx playwright install --with-deps chromium
      - name: Validate release (RELEASE_MODE == 'strict')
        if: vars.RELEASE_MODE == 'strict'
        run: npm run validate:release
        env:
          BASE_PATH: /requisito-a-requisito
      # QA visual en cada push: la matriz completa de layout (chromium)
      # sobre el export recién construido — que un cambio no rompa la
      # maquetación otra vez (F10-VIS).
      - name: Install Chromium (QA visual)
        run: npx playwright install --with-deps chromium
      - name: Suite visual-layout (matriz completa, chromium)
        run: npx playwright test tests/e2e/visual-layout.spec.ts --project=desktop-chromium
        env:
          BASE_PATH: /requisito-a-requisito
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-layout-report
          path: test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
