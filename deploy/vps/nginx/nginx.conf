# nginx para requisito.h1756.es (imagen nginx-unprivileged, uid 101).
# Sirve /srv/requisito/CURRENT — symlink que update.sh cambia con mv -T;
# nginx lo resuelve por petición, no hace falta recargar.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Privacidad (regla 4.6): el log no guarda query string ni Referer.
	log_format privacy
		'$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
	access_log /dev/stdout privacy;

	sendfile on;
	gzip on;
	gzip_min_length 512;
	gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

	server_tokens off;
	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server {
		listen 8080;
		root /srv/requisito/CURRENT;
		index index.html;

		include /etc/nginx/requisito-headers.conf;
		add_header Cache-Control "no-cache" always;

		location / {
			include /etc/nginx/requisito-headers.conf;
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ =404;
		}

		# Assets con hash de contenido: inmutables.
		location /_next/ {
			include /etc/nginx/requisito-headers.conf;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			try_files $uri =404;
		}

		# Datos públicos (bundle.json se revalida en cada visita).
		location /datos/ {
			include /etc/nginx/requisito-headers.conf;
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ =404;
		}

		# 404 del propio export (Next genera /404.html).
		error_page 404 /404.html;
	}
}
